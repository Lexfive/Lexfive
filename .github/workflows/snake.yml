name: Generate snake game

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Lexfive
          outputs: |
            dist/github-snake.svg?color_snake=#383838&color_dots=#ebedf0,#f6b3b3,#e86a6a,#d30000,#8a0000
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#1a1a1a,#4d0000,#850000,#b00000,#ff2a2a&color_background=#000000

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
