name: Generate snake game

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Lexfive
          outputs: |
            dist/github-snake.svg?color_snake=#e8822e&color_dots=#ebedf0,#f6c89e,#efa765,#e8822e,#a4520f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e8822e&color_dots=#161616,#4a2a10,#7a4416,#b5631f,#e8822e&color_background=#000000

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
