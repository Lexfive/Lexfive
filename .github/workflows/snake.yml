name: Generate snake game

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Lexfive
          outputs: |
            dist/github-snake.svg?color_snake=#5d0018&color_dots=#ebedf0,#f1dfae,#e3c064,#d29f22,#8a6510
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f2f2f2&color_dots=#252628,#4a3a10,#7a5f16,#a87f1b,#d29f22&color_background=#19171b

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
